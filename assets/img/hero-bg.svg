<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="0.55" stop-color="#e2e6ea"/>
      <stop offset="1" stop-color="#d5dade"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa694"/>
      <stop offset="1" stop-color="#77836f"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="speckle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.5" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="g2" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft8" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
<rect width="900" height="675" fill="#14181d"/>
<radialGradient id="g1" cx="0.22" cy="0.28" r="0.8"><stop offset="0" stop-color="#39414b"/><stop offset="1" stop-color="#14181d"/></radialGradient>
<rect width="900" height="675" fill="url(#g1)"/>
<rect width="900" height="675" fill="#000" opacity="0.35" filter="url(#speckle)"/>
<ellipse cx="700" cy="120" rx="320" ry="220" fill="#c8a24a" opacity="0.16" filter="url(#soft)"/>
<ellipse cx="120" cy="620" rx="300" ry="180" fill="#c8a24a" opacity="0.08" filter="url(#soft)"/></svg>