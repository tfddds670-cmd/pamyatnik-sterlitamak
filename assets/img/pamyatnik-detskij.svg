<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="0.55" stop-color="#e2e6ea"/>
      <stop offset="1" stop-color="#d5dade"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa694"/>
      <stop offset="1" stop-color="#77836f"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="speckle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.5" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="g2" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft8" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
<rect width="900" height="675" fill="url(#sky)"/><ellipse cx="90" cy="500" rx="200" ry="120" fill="#5d6d57" opacity="0.55" filter="url(#soft8)"/><ellipse cx="820" cy="496" rx="220" ry="130" fill="#54644f" opacity="0.5" filter="url(#soft8)"/><ellipse cx="450" cy="470" rx="300" ry="90" fill="#8fa08a" opacity="0.45" filter="url(#soft)"/><rect y="520" width="900" height="155" fill="url(#ground)"/><path d="M0 520 Q225 502 450 519 T900 514 L900 545 L0 545 Z" fill="#8d9a83" opacity="0.6"/>

    <linearGradient id="granite" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#9aa1a8"/>
      <stop offset="0.45" stop-color="#6d747c"/>
      <stop offset="1" stop-color="#3d434a"/>
    </linearGradient>
    <linearGradient id="graniteDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d747c"/>
      <stop offset="1" stop-color="#3d434a"/>
    </linearGradient>
    
<ellipse cx="450.0" cy="584" rx="195.0" ry="26" fill="#1b2118" opacity="0.30" filter="url(#soft8)"/>
